name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: 'v0.1.0'
          releaseBody: |
            ### Insight Log v0.1.0

            轻量级跨平台本地日志搜索桌面应用（Tauri 2 + React + Rust）。

            #### 核心特性
            - **搜索优先交互**：主搜索条居中，高级筛选可折叠，侧边文件树可随需收起
            - **虚拟滚动结果列表**：万级匹配日志也可流畅滚动
            - **压缩包内直接检索**：按魔数识别 ZIP / TAR / GZ / 7z，无需先手动解压（不支持 RAR 与加密归档）
            - **管道式多条件过滤**：`error | timeout` 表示同一行须同时满足全部条件（AND）
            - **路径沙箱**：文件读取限制在选定的搜索根目录内

            说明：单文件搜索上限 100MB；压缩包单条目解压上限 20MB、累计 100MB。详见 README。

            ---

            #### 各平台下载
            - **Linux (x86_64)**：`.deb`（Debian/Ubuntu）和/或 `.AppImage`
            - **Windows (x64)**：NSIS `.exe`、`.msi`，以及绿色版 / portable zip（解压即运行；需 WebView2）
            - **macOS (Apple Silicon / aarch64)**：`.dmg`（本 release 未签代码签名）

            具体文件名以本页 Assets 为准。

            ---

            #### 未签名说明
            本版本未购买商业代码签名证书：
            - **macOS**：若提示无法验证开发者或「已损坏」，可在「系统设置 → 隐私与安全性」选择仍要打开，或执行 `xattr -cr /Applications/insight-log.app`
            - **Windows**：若 SmartScreen 拦截，可点「更多信息」→「仍要运行」
            - **Linux AppImage**：可能需要 `libfuse2`，并先 `chmod +x`

            ---

            #### 链接
            - 官网：https://zyf8827.github.io/insight-log-website/
            - 源码：https://github.com/zyf8827/insight-log
            - Issues：https://github.com/zyf8827/insight-log/issues
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Windows portable zip (绿色版)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exeCandidates = @(
            'src-tauri/target/release/insight-log.exe',
            'src-tauri/target/x86_64-pc-windows-msvc/release/insight-log.exe'
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "insight-log.exe not found. Looked in: $($exeCandidates -join ', ')"
          }
          $zipName = 'insight-log_0.1.0_x64_portable.zip'
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path $exe -DestinationPath $zipName -Force
          Write-Host "Created $zipName from $exe"
          Get-Item $zipName | Format-List Name, Length, FullName

      - name: Upload Windows portable zip to Release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v0.1.0' }
          $zipName = 'insight-log_0.1.0_x64_portable.zip'
          gh release upload $tag $zipName --clobber
          Write-Host "Uploaded $zipName to release $tag"
